name: CI

on:
  push:
    branches: [ main, v2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and cache PowerShell modules
        uses: potatoqualitee/psmodulecache@v6.2.1
        with:
          modules-to-cache: Pester:5.7.1, PSScriptAnalyzer:1.22.0, PowerShellBuild:0.6.1, BuildHelpers:2.0.16, psake:4.9.0
          shell: pwsh

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Invoke-ScriptAnalyzer -Path . -Recurse -ReportSummary -Settings PSScriptAnalyzerSettings.psd1 -ExcludeRule PSAvoidUsingWriteHost

      - name: Run Tests with Coverage
        shell: pwsh
        run: |
          ./build.ps1 -Task Test -Bootstrap
          
      - name: Generate Coverage Report
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = './BPC.Admin/Public', './BPC.Admin/Private'
          $config.CodeCoverage.OutputFormat = 'CoverageGutters'
          $config.CodeCoverage.OutputPath = './coverage.xml'
          $config.CodeCoverage.CoveragePercentTarget = 80
          Invoke-Pester -Configuration $config

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/out/testResults*.xml

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and cache PowerShell modules
        uses: potatoqualitee/psmodulecache@v6.2.1
        with:
          modules-to-cache: Pester:5.7.1, PSScriptAnalyzer:1.22.0, PowerShellBuild:0.6.1, BuildHelpers:2.0.16, psake:4.9.0
          shell: pwsh

      - name: Build Module
        shell: pwsh
        run: |
          ./build.ps1 -Bootstrap

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPC.Admin
          path: Output/BPC.Admin/